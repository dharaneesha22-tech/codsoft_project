<!-- templates/register.html -->

<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register</title>

    <link rel="stylesheet"
          href="{{ url_for('static',
          filename='style.css') }}">

</head>

<body>

<div class="register-container">

    <div class="register-box">

        <h1>Create Account</h1>

        <p class="subtitle">
            AI Spam SMS Detection System
        </p>

        <form action="/register_user"
              method="POST">

            <div class="input-group">

                <label>Username</label>

                <input type="text"
                       name="username"
                       placeholder="Enter Username"
                       required>

            </div>

            <div class="input-group">

                <label>Password</label>

                <input type="password"
                       name="password"
                       placeholder="Enter Password"
                       required>

            </div>

            <button type="submit"
                    class="register-btn">

                Register

            </button>

        </form>

        {% if error %}

        <div class="error-box">

            {{ error }}

        </div>

        {% endif %}

        <div class="bottom-link">

            <p>
                Already have an account?
            </p>

            <a href="/">

                Back To Login

            </a>

        </div>

    </div>

</div>

</body>

</html>
